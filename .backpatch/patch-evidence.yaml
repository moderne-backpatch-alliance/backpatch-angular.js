schema: osera-patch-evidence/0.1.0
producer: moderne
release: 1.8.4-backpatch-00010
baseline: v1.8.3+backpatch.baseline
fixes:
  - cve: CVE-2026-11998
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-11998
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/820956f
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00004. A trusted resource URL list RegExp matches its source in a non-capturing group, ^(?:source)$, so every alternative matches the entire URL (PebblePad's 88d6786e, MIT). angular carries it and is rebuilt."
  - cve: CVE-2023-26117
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-26117
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/60db2bd
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular-resource
    note: "Carried from 1.8.4-backpatch-00004. $resource stripped trailing slashes with url.replace(/\\/+$/, ''), which backtracks quadratically on a long run of slashes inside the URL; a loop from the end now removes them. The loop is Debian's CVE-2023-26117 patch for angular.js 1.8.3-3 (MIT), in upstream's style. The code ships in angular-resource, while the advisory names angular; angular-resource carries it and is rebuilt."
  - cve: CVE-2025-2336
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2025-2336
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/71b55d9
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular-sanitize
    note: "Carried from 1.8.4-backpatch-00004. With SVG enabled, $sanitize checked the href and xlink:href of an SVG image element against the link allow-list, so an app restricting image sources with imgSrcSanitizationTrustedUrlList still let an image from any link-allowed URL through; they are now checked as image URLs, like img src, a refused one dropped as $sanitize drops any. The change is Debian's CVE-2025-2336 patch for angular.js 1.8.3-3 (MIT). angular-sanitize carries it and is rebuilt. With `$sanitizeProvider.enableSvg(true)` and the default lists, an SVG image element's href now keeps `data:image` and `blob:` URLs, which the image list allows, and loses `mailto:`, `tel:` and `sftp:` URLs, which only the link list allows."
  - cve: CVE-2024-8373
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2024-8373
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/992913d
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00004. Attributes.$set sanitized srcset only on img, so an interpolated srcset on a picture's source element kept a URL that imgSrcSanitizationTrustedUrlList refuses; source srcset now goes through the same sanitizeSrcset. A source srcset with no ASCII whitespace (the srcset parser's whitespace, so a no-break space does not count) is checked as one URL, its edge commas and spaces dropped in one linear pass, and that URL is the one written, so a comma-led URL is checked as the host it names. A refused URL gets AngularJS's own unsafe: prefix. angular carries it and is rebuilt. A source srcset without ASCII whitespace is checked as the one URL the browser loads."
  - cve: CVE-2025-0716
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2025-0716
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/10063bd
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00005. An interpolated href or ng-href on an SVG image element had no trusted context, so it skipped imgSrcSanitizationTrustedUrlList and loaded an image from any URL, while the same URL in xlink:href was sanitized; href and ng-href on image now take the MEDIA_URL context; a refused URL gets AngularJS's own unsafe: prefix. angular carries it and is rebuilt. An interpolated href or ng-href on an SVG image element whose value is undefined now leaves the element without that attribute, where 1.8.3 wrote href=\"\" or kept ng-href=\"\"."
  - cve: CVE-2024-21490
    upstream_fix_url: https://github.com/PebblePad/angular.js/commit/2111de19f71fa70ed8aa0a0797612718a6f6e867
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2024-21490
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/compare/7c32648~1...3939dd6
    basis: adapted
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00006; PebblePad's 2111de19 (https://github.com/PebblePad/angular.js/commit/2111de19f71fa70ed8aa0a0797612718a6f6e867), as Debian's angular.js 1.8.3-3 carries it for CVE-2024-21490 and CVE-2024-8372, in ES5, with a check of ours on top. sanitizeSrcset split a srcset that has whitespace in it with a regex that, from each position inside a run of whitespace, scanned to the end of that run, so an interpolated img srcset or an ng-prop-srcset with a long run of whitespace took time quadratic in its length (about 6 s for 40,000 spaces in Chromium 128); a srcset is now split at every comma, in time linear in its length. angular carries it and is rebuilt. An interpolated img or source srcset, or an ng-prop-srcset, is now split at every comma, where 1.8.3 split at whitespace: each part is trimmed, its first run of two or more whitespace characters (no-break spaces included) becomes one space, and it is checked as a URL followed by at most one descriptor, any further words being dropped; the parts are written joined by commas without the spaces around them, and a single whitespace character other than a space before a descriptor, such as a tab or a no-break space, is kept as written. So a candidate without a descriptor joins the next one: img.png, img@2x.png 2x is read by the browser as the one URL img.png,img@2x.png, and the image breaks, as it does when a no-break space or another non-ASCII space before a descriptor becomes part of the URL. A URL with a comma in it, such as a data: URL or a path like w_400,h_300, is checked as separate parts, and a part after a comma resolves against the page: when imgSrcSanitizationTrustedUrlList refuses the page's own origin, that part gets an unsafe: prefix and the image breaks; when it allows it, such a URL is written as given, and a whitespace-free one on img loads whole, where 1.8.3 split it. A srcset from which the browser would read a URL other than the ones checked, not already marked unsafe:, that the check would refuse or rewrite, such as parts joined across a comma into another host, is written empty, so an img falls back to its src; with a $sceDelegate that rewrites media URLs, such as a proxy, that includes every srcset whose parts join, which with such a delegate includes values with a leading or doubled comma or a tab before a descriptor. An interpolated source srcset without ASCII whitespace is checked as one URL."
  - cve: CVE-2024-8372
    upstream_fix_url: https://github.com/PebblePad/angular.js/commit/2111de19f71fa70ed8aa0a0797612718a6f6e867
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2024-8372
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/compare/7c32648~1...3939dd6
    basis: adapted
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00006; PebblePad's 2111de19 (https://github.com/PebblePad/angular.js/commit/2111de19f71fa70ed8aa0a0797612718a6f6e867), as Debian's angular.js 1.8.3-3 carries it for CVE-2024-21490 and CVE-2024-8372, in ES5, with a check of ours on top. sanitizeSrcset checked the URLs of its own split of a srcset, which differs from the browser's: the browser ends a candidate's descriptors at a comma and skips commas before a URL, so in values such as 'good.png xyz,evil.png', ',evil.png 1x' or 'a.png 1x,,evil.png 2x' on an interpolated img srcset or an ng-prop-srcset, it loaded a URL that imgSrcSanitizationTrustedUrlList refuses. A srcset is now split at every comma and each part's URL checked; the value written is then read as the browser reads it, and one from which the browser would read a URL other than the ones checked that imgSrcSanitizationTrustedUrlList refuses, as when parts join across a comma, is written empty, so the browser loads no URL from it that the check refused. angular carries it and is rebuilt. An interpolated img or source srcset, or an ng-prop-srcset, is now split at every comma, where 1.8.3 split at whitespace: each part is trimmed, its first run of two or more whitespace characters (no-break spaces included) becomes one space, and it is checked as a URL followed by at most one descriptor, any further words being dropped; the parts are written joined by commas without the spaces around them, and a single whitespace character other than a space before a descriptor, such as a tab or a no-break space, is kept as written. So a candidate without a descriptor joins the next one: img.png, img@2x.png 2x is read by the browser as the one URL img.png,img@2x.png, and the image breaks, as it does when a no-break space or another non-ASCII space before a descriptor becomes part of the URL. A URL with a comma in it, such as a data: URL or a path like w_400,h_300, is checked as separate parts, and a part after a comma resolves against the page: when imgSrcSanitizationTrustedUrlList refuses the page's own origin, that part gets an unsafe: prefix and the image breaks; when it allows it, such a URL is written as given, and a whitespace-free one on img loads whole, where 1.8.3 split it. A srcset from which the browser would read a URL other than the ones checked, not already marked unsafe:, that the check would refuse or rewrite, such as parts joined across a comma into another host, is written empty, so an img falls back to its src; with a $sceDelegate that rewrites media URLs, such as a proxy, that includes every srcset whose parts join, which with such a delegate includes values with a leading or doubled comma or a tab before a descriptor. An interpolated source srcset without ASCII whitespace is checked as one URL."
  - cve: CVE-2023-26116
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-26116
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/9c3b0ca
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00007. angular.copy took a RegExp's flags with a regex that, from each position of the source, ran to the next slash before failing, so copying a RegExp with a long source took time quadratic in its length (about 4.6 s for 100,000 characters in Chromium 128); the flags, the text after the last slash of the RegExp's string, are now taken with lastIndexOf. angular carries it and is rebuilt."
  - cve: CVE-2022-25844
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2022-25844
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/0fcf860
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00008. With an empty currency symbol, the currency filter removed the symbol and the whitespace around it with a regex that, from each position of a run of whitespace no symbol follows, scanned to the end of that run, so a locale pattern with a long run of whitespace made currency(amount, '') take time quadratic in its length (about 2.3 s for 60,000 spaces in Chromium 128); the same replacement is now done in one pass. angular carries it and is rebuilt."
  - cve: CVE-2025-4690
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2025-4690
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/c74e13b
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular-sanitize
    note: "Carried from 1.8.4-backpatch-00009. ngSanitize's linky filter found each link with a regex whose e-mail address branch took a run of address characters from each of the run's positions before failing at its end when no @ followed, so linky on a long word or a long run of dots or dashes took time quadratic in its length (about 2.2 s for each of two 60,000-character runs in Chromium 128); links are now found in one pass that returns what that regex matched. angular-sanitize carries it and is rebuilt."
  - cve: CVE-2023-26118
    upstream_fix_url: https://salsa.debian.org/js-team/angular.js/-/commit/4d82e2dd70a745380d60433a6bbd81f9d0d33194
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-26118
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/compare/f86bc0a~1...0cde553
    basis: adapted
    artifacts:
      - angular
    note: "New in this release; the change is the fix of angular/angular.js's community successors: Debian's angular.js 1.8.3-3 CVE-2023-26118.patch (https://salsa.debian.org/js-team/angular.js/-/commit/4d82e2dd70a745380d60433a6bbd81f9d0d33194), with one alternative of ours. URL_REGEXP, which validates an input of type url, let a run of slashes after the scheme be split between its slashes and its user name in every way, so a value with a long run of slashes that then failed took time quadratic in its length (about 4.6 s for 60,000 slashes in Chromium 128); with Debian's regex the user name does not start with a slash, and with ours it may also be one slash, so the run is split one way and validation takes linear time. angular carries it and is rebuilt; angular-resource and angular-sanitize are rebuilt too. AngularJS's error messages now link to https://errors.angularjs.org/<version>/... with this line's version, which redirects to a code.angularjs.org page that does not exist (404), where 1.8.3's link resolves."
tests:
  commit: 0cde553f65f737036ee8ea95d0be8b0b0bedd6c4
  command: "yarn 1.22.22 install --frozen-lockfile --ignore-scripts at the tag, then at the tested commit upstream's karma suites (karma-jqlite, karma-jquery, karma-jquery-2.2, karma-jquery-2.1, karma-modules, karma-modules-ngAnimate, karma-modules-ngMock, karma-docs) in headless Chromium with karma's junit reporter, the 3 input datetime-local specs left out by a spec filter in the run, and promises-aplus-tests on grunt's adapter with mocha's xunit reporter; the counter's own specs ran the same way on the packaged angular.js and angular.min.js with upstream's core test helpers mapped to their public angular equivalents (and, for the input specs, VALIDITY_STATE_PROPERTY to src's value), where toThrowMinErr checks namespace and code since the minified file strips minErr messages; hostname attributes removed from the reports"
  runtime: Node.js v16.20.2, yarn 1.22.22, Temurin 17.0.10, Chromium 128.0.6613.18 headless, macOS 27.2 arm64
  report: angular-1.8.4-backpatch-00010-tests.zip
  report_sha256: d5544708668760d4c37530b6bdf982ee4976e3fcc73983f29f3e9d3bba2fe5e2
  result: pass
  note: "Upstream's suites at the tested commit: jqlite 6238, jquery 6242, jquery 2.2 and jquery 2.1 6238 each, all passed but the 3 input datetime-local specs left out of each, excluded with an operator's yes as at 1.8.4-backpatch-00001 (Chrome's datetime-local value drops trailing zeros of the milliseconds, so they fail at 1.8.3 and here alike); modules 678, ngAnimate 552, ngMock 279, docs 15 and Promises/A+ 872 passed, with upstream's URL_REGEXP cases unchanged. One spec is ours: \"should validate a url with a long run of slashes in time linear in its length\" fails on the code below this release's two commits (4.5 s) and on npmjs's 1.8.3 angular.js and angular.min.js (4.5 s), and passes here (17 ms); its three values' validity is asserted before the time. With only the second commit reverted, Debian's regex alone, it passes and upstream's URL_REGEXP case scheme://:password@example.com fails, which the second commit fixes. On the packaged files it ran with test/ng/directive/inputSpec.js's other specs filtered out. At this release's version without this fix, the members' files differ from 1.8.4-backpatch-00009's only in the version; with it, angular.js differs by the fix's lines. The archive's file-origins.yaml names the origin of every file the release publishes, for all 14 members: a built file by its build and inputs at the tested commit, every other file by its path in upstream's angular/bower-<member> at that repository's v1.8.3 commit, byte for byte, and each package.json as that file with only its version line rewritten."
