schema: osera-patch-evidence/0.1.0
producer: moderne
release: 1.8.4-backpatch-00004
baseline: v1.8.3+backpatch.baseline
fixes:
  - cve: CVE-2026-11998
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-11998
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/820956f
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular
    note: "Carried from 1.8.4-backpatch-00003; no upstream fix. A trusted resource URL list RegExp matches its source in a non-capturing group, ^(?:source)$, so every alternative matches the entire URL (PebblePad's 88d6786e, MIT); a banned RegExp keeps 1.8.3's ^source$, so no ban narrows. angular carries it and is rebuilt."
  - cve: CVE-2023-26117
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-26117
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/60db2bd
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular-resource
    note: "Carried from 1.8.4-backpatch-00003; no upstream fix. $resource stripped trailing slashes with url.replace(/\\/+$/, ''), which backtracks quadratically on a long run of slashes inside the URL; a loop from the end now removes them, and a URL of only slashes still becomes '/'. The loop is Debian's CVE-2023-26117 patch for angular.js 1.8.3-3 (MIT), in upstream's style. The code ships in angular-resource, not in angular, which the advisory names; angular-resource carries it and is rebuilt."
  - cve: CVE-2025-2336
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2025-2336
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/71b55d9
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular-sanitize
    note: "Carried from 1.8.4-backpatch-00003; no upstream fix. With SVG enabled, $sanitize checked the href and xlink:href of an SVG image element against the link allow-list, so an app restricting image sources with imgSrcSanitizationTrustedUrlList still let an image from any link-allowed URL through; they are now checked as image URLs, like img src, and links keep the link check. The change is Debian's CVE-2025-2336 patch for angular.js 1.8.3-3 (MIT). angular-sanitize carries it and is rebuilt. With `$sanitizeProvider.enableSvg(true)` and the default lists, an SVG image element's href now keeps `data:image` and `blob:` URLs, which the image list allows, and loses `mailto:`, `tel:` and `sftp:` URLs, which only the link list allows."
  - cve: CVE-2024-8373
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2024-8373
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-angular.js/commit/992913d
    not_applicable_rationale: a provider-developed fix; no upstream-authored code to credit
    basis: original
    artifacts:
      - angular
    note: "New in this release; upstream (angular/angular.js) is end of life and has no fix. Attributes.$set sanitized srcset only on img, so an interpolated srcset on a picture's source element kept a URL that imgSrcSanitizationTrustedUrlList refuses; source srcset now goes through the same sanitizeSrcset, as ng-prop-srcset already did for both. A source srcset with no ASCII whitespace (the srcset parser's whitespace, so a no-break space does not count) is checked as one URL, its edge commas and spaces dropped in one linear pass, and that URL is the one written, so a data: URL or a CDN path with commas keeps loading and a comma-led URL is checked as the host it names; img srcset keeps 1.8.3's handling. A refused URL gets AngularJS's own unsafe: prefix, as on img. The source change is PebblePad's 7cb36590 (MIT), as Debian backports it for angular.js 1.8.3-3; the one-URL check is ours. angular carries it and is rebuilt; angular-resource and angular-sanitize are rebuilt for the earlier fixes, and the other 11 members ship as npmjs's 1.8.3 files. A source srcset with ASCII whitespace in it is split into candidates the way 1.8.3 splits an img srcset, so the srcset forms of CVE-2024-8372, where the URL checked is not the one the browser loads, and the quadratic parsing of CVE-2024-21490 reach source as they reach img. Both CVEs stay open on this line. A source srcset without ASCII whitespace is checked as the one URL the browser loads."
tests:
  commit: 992913de8d40a1ea2b8200aef58b82245a7779d8
  command: "yarn 1.22.22 install --frozen-lockfile --ignore-scripts at the tag, then at the tested commit upstream's karma suites (karma-jqlite, karma-jquery, karma-jquery-2.2, karma-jquery-2.1, karma-modules, karma-modules-ngAnimate, karma-modules-ngMock, karma-docs) in headless Chromium with karma's junit reporter, the 3 input datetime-local specs left out by a spec filter in the run, and promises-aplus-tests on grunt's adapter with mocha's xunit reporter; the counter's own specs ran the same way on the packaged angular.js and angular.min.js with upstream's core test helpers mapped to their public angular equivalents, where toThrowMinErr checks namespace and code since the minified file strips minErr messages; hostname attributes removed from the reports"
  runtime: Node.js v16.20.2, yarn 1.22.22, Temurin 17.0.10, Chromium 128.0.6613.18 headless, macOS 27.2 arm64
  report: angular-1.8.4-backpatch-00004-tests.zip
  report_sha256: 441b89807074bd29ab2bc40f43c1f192f1c4e9b3f9b6e90ca99080ee653a2e8e
  result: pass
  note: "Upstream's suites at the tested commit: jqlite 6229, jquery 6233, jquery 2.2 and jquery 2.1 6229 each, all passed but the 3 input datetime-local specs left out of each, excluded with an operator's yes as at 1.8.4-backpatch-00001 (Chrome's datetime-local value drops trailing zeros of the milliseconds, so they fail at 1.8.3 and here alike); modules 677, ngAnimate 552, ngMock 279, docs 15 and Promises/A+ 872 passed. Three specs are ours. \"should sanitize the srcset of source elements\" and \"should sanitize the srcset of source elements as one url when it has no whitespace\" fail on the code below the fix and on npmjs's 1.8.3 angular.js and angular.min.js, and pass here; the second also fails without the one-URL check, where a data: URL is split at its comma, with it but without dropping a leading comma, where a comma-led javascript: URL is kept, with it testing \\s rather than ASCII whitespace, where a comma-led value with a no-break space is split and kept, and with a single comma strip, where a value led by a comma and a no-break space is written untrimmed. \"should sanitize a source srcset with no whitespace in time linear in its length\" passes on 1.8.3 and here, and fails where the edge commas are stripped by a regex or a loop (4.6 to 9 s for 100,000 commas or 40,000 comma and no-break space pairs). On the packaged files they ran with test/ng/compileSpec.js's other specs filtered out. At this release's version without this fix, the members' files differ from 1.8.4-backpatch-00003's only in the version; with it, angular.js differs by the fix's lines. The archive's file-origins.yaml names each packaged file's origin."
